name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Añadir plataforma iOS
        run: npx cap add ios

      - name: Sincronizar Capacitor
        run: npx cap sync ios

      - name: Compilar aplicación iOS sin firma
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -R build/App.app Payload/
          zip -r ControlFiscal-unsigned.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: ControlFiscal-unsigned-IPA
          path: ControlFiscal-unsigned.ipa
