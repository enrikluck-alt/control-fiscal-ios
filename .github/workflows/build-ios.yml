name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Configure iOS permissions
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path('ios/App/App/Info.plist')
          with p.open('rb') as f:
              data = plistlib.load(f)
          data['NSFaceIDUsageDescription'] = 'Control Fiscal utiliza Face ID para desbloquear la aplicación de forma segura.'
          data['UIViewControllerBasedStatusBarAppearance'] = True
          with p.open('wb') as f:
              plistlib.dump(data, f, sort_keys=False)
          PY

      - name: Set minimum iOS deployment target to 15.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/App/App.xcodeproj/project.pbxproj')
          s = p.read_text()
          for old in ('14.0','13.0','12.0'):
              s = s.replace(f'IPHONEOS_DEPLOYMENT_TARGET = {old};', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;')
          p.write_text(s)
          PY

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/App.app"
          IPA_PATH="$PWD/build/ControlFiscal.ipa"

          echo "=== Comprobación de App.app ==="
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/App"
          du -sh "$APP_PATH"
          find "$APP_PATH" -type f | wc -l

          echo "=== Contenido principal de App.app ==="
          ls -lah "$APP_PATH" | head -80

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/ControlFiscal.app

          echo "=== Empaquetando IPA ==="
          cd build/ipa
          /usr/bin/zip -qry "$IPA_PATH" Payload
          cd ../..

          echo "=== Comprobación de IPA ==="
          test -f "$IPA_PATH"
          ls -lh "$IPA_PATH"
          stat -f "%z bytes" "$IPA_PATH"

          SIZE=$(stat -f "%z" "$IPA_PATH")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: IPA demasiado pequeña: ${SIZE} bytes"
            exit 1
          fi

          /usr/bin/unzip -t "$IPA_PATH"
          echo "=== Primeros archivos dentro de la IPA ==="
          /usr/bin/unzip -l "$IPA_PATH" | head -60

          printf 'IPA_SIZE_BYTES=%s\nIPA_PATH=%s\n' "$SIZE" "$IPA_PATH" > build/IPA_SIZE.txt

      - name: Guardar IPA y diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: ControlFiscal-IPA
          path: |
            build/ControlFiscal.ipa
            build/IPA_SIZE.txt
          if-no-files-found: error
          retention-days: 7
