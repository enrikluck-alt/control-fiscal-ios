name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Añadir plataforma iOS
        run: npx cap add ios

      - name: Sincronizar Capacitor
        run: npx cap sync ios

      - name: Configurar versión mínima de iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/App/App.xcodeproj/project.pbxproj")
          s = p.read_text()

          s = s.replace(
              "IPHONEOS_DEPLOYMENT_TARGET = 14.0;",
              "IPHONEOS_DEPLOYMENT_TARGET = 15.0;"
          )

          s = s.replace(
              "IPHONEOS_DEPLOYMENT_TARGET = 13.0;",
              "IPHONEOS_DEPLOYMENT_TARGET = 15.0;"
          )

          s = s.replace(
              "IPHONEOS_DEPLOYMENT_TARGET = 12.0;",
              "IPHONEOS_DEPLOYMENT_TARGET = 15.0;"
          )

          p.write_text(s)
          PY

      - name: Compilar aplicación iOS sin firma
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=

      - name: Crear IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/App.app"

          test -d "$APP_PATH"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload

          cp -R "$APP_PATH" build/ipa/Payload/ControlFiscal.app

          cd build/ipa
          zip -qry ../ControlFiscal-unsigned.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: ControlFiscal-unsigned-IPA
          path: build/ControlFiscal-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
